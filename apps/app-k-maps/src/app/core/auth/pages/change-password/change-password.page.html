<ion-content [fullscreen]="true" class="cp-page">
  <div class="cp">
    <div class="cp__glow" aria-hidden="true"></div>

    <div class="cp__card">
      <div class="cp__head">
        <div class="cp__icon" aria-hidden="true">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <h1>{{ forced ? 'Set a new password' : 'Change password' }}</h1>
        <p *ngIf="forced">
          Your account was created with a temporary password. Choose a new one
          to continue.
        </p>
        <p *ngIf="!forced">Update the password for your account.</p>
      </div>

      <div class="cp__error" *ngIf="errorMessage">
        <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="cp__form">
        <label class="cp__field">
          <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
          <input
            type="password"
            placeholder="Current password"
            formControlName="current_password"
            autocomplete="current-password"
          />
        </label>

        <label class="cp__field">
          <ion-icon name="key-outline" aria-hidden="true"></ion-icon>
          <input
            type="password"
            placeholder="New password (min 8 characters)"
            formControlName="new_password"
            autocomplete="new-password"
          />
        </label>

        <label class="cp__field">
          <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
          <input
            type="password"
            placeholder="Confirm new password"
            formControlName="confirm"
            autocomplete="new-password"
          />
        </label>

        <button type="submit" class="cp__submit" [disabled]="loading">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Update password</span>
        </button>
      </form>

      <button type="button" class="cp__link" (click)="cancel()" *ngIf="!forced">
        Cancel
      </button>
      <button type="button" class="cp__link" (click)="signOut()" *ngIf="forced">
        Sign out instead
      </button>
    </div>
  </div>
</ion-content>
