<ion-menu menuId="main-menu" contentId="main" type="overlay">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list lines="none">
      <ion-menu-toggle autoHide="true" *ngFor="let entry of menuEntries; trackBy: trackEntry">
        <ion-item [routerLink]="entry.route" routerDirection="root" detail="false" class="menu-entry">
          <ion-icon [icon]="entry.icon" slot="start" class="menu-icon"></ion-icon>
          <ion-label class="menu-label">
            <h2>{{ entry.title }}</h2>
          </ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>
