<ion-content [fullscreen]="true" class="home-content">
  <div class="home" #page>

    <!-- CSS floating particles -->
    <div class="home__particles" aria-hidden="true">
      @for (i of particles; track i) {
        <span class="particle" [style.--i]="i"></span>
      }
    </div>

    <!-- Three.js fire stage -->
    <div class="home__fire-stage" aria-hidden="true">
      <div #fireHost class="home__fire-webgl"></div>
    </div>

    <!-- Brand -->
    <header class="home__header" #logo>
      <div class="home__logo-wrap">
        <div class="home__logo-emblem" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="url(#gr)" stroke-width="1"/>
            <path d="M24 8 L28 18 L38 18 L30 26 L33 36 L24 30 L15 36 L18 26 L10 18 L20 18 Z"
                  fill="url(#gs)" opacity="0.9"/>
            <defs>
              <linearGradient id="gr" x1="0" y1="0" x2="48" y2="48">
                <stop offset="0%"   stop-color="#c9a84c" stop-opacity="0.4"/>
                <stop offset="50%"  stop-color="#e8c96a"/>
                <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.4"/>
              </linearGradient>
              <linearGradient id="gs" x1="10" y1="8" x2="38" y2="36">
                <stop offset="0%"   stop-color="#e8c96a"/>
                <stop offset="100%" stop-color="#c9a84c"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="home__logo-text">
          <span class="logo-name">K-MAPS</span>
          <span class="logo-sub" #subtitle>Knowledge Command Center</span>
        </div>
      </div>
    </header>

    <!-- Module cards -->
    <main class="home__cards" #cardsRow>
      @for (mod of modules; track mod.id) {
        <button
          class="km-module-card"
          [class]="'km-module-card--' + mod.id"
          (click)="navigate(mod.route)"
          [attr.aria-label]="'Open ' + mod.label"
          type="button"
        >
          <div class="km-module-card__artwork">
            <span class="km-module-card__glyph">{{ mod.glyph }}</span>
            <div class="km-module-card__shimmer"></div>
          </div>
          <div class="km-module-card__bottom-glow"></div>
          <span class="km-module-card__label">{{ mod.label }}</span>
        </button>
      }
    </main>

    <!-- Footer -->
    <footer class="home__footer" #domainLabel>
      <span class="km-divider-text">Select a Domain</span>
    </footer>

  </div>
</ion-content>
