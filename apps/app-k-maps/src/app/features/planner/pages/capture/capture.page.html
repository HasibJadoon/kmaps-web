<ion-header class="study-toolbar-wrap">
  <ion-toolbar class="study-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/planner" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Capture</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" aria-label="New note" (click)="newNote()">
        <ion-icon name="create-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="study-content" [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="study-shell ion-padding km-planner-wrap">
    <ng-container *ngIf="loading(); else captureLoaded">
      <section class="km-panel">
        <ion-skeleton-text animated style="width: 100%; height: 4.4rem; margin-bottom: 0.5rem"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 100%; height: 4.4rem; margin-bottom: 0.5rem"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 100%; height: 4.4rem"></ion-skeleton-text>
      </section>
    </ng-container>

    <ng-template #captureLoaded>
      <section class="km-panel km-panel--segment" *ngIf="items().length > 0">
        <ion-segment class="km-status-segment" [value]="range()" (ionChange)="setRange($event.detail.value)">
          <ion-segment-button *ngFor="let item of ranges" [value]="item.id">
            <ion-label>{{ item.label }}</ion-label>
          </ion-segment-button>
        </ion-segment>
      </section>

      <section class="km-capture-grid" *ngIf="visibleItems().length > 0; else emptyCapture">
        <button
          type="button"
          class="km-capture-card"
          *ngFor="let note of visibleItems()"
          [attr.data-status]="note.status"
          (click)="openNote(note)"
        >
          <h3 class="km-capture-card__title">{{ titleOf(note) }}</h3>
          <span
            class="km-capture-card__chip"
            [attr.data-status]="note.status"
            role="button"
            tabindex="0"
            (click)="changeStatus($event, note)"
          >
            {{ statusLabel(note.status) }}
          </span>
        </button>
      </section>

      <ng-template #emptyCapture>
        <section class="km-panel km-empty-state">
          <h3>No notes yet</h3>
          <p>Tap the pencil to start a note — capture a thought, then move it through Draft → Plan → Review → Done.</p>
        </section>
      </ng-template>
    </ng-template>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button aria-label="New note" (click)="newNote()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<ion-modal class="km-source-metadata-modal" [isOpen]="triageOpen()" (ionModalDidDismiss)="closeTriage()">
  <ng-template>
    <ion-header>
      <ion-toolbar class="study-toolbar">
        <ion-title>Triage Capture</ion-title>
        <ion-buttons slot="end">
          <ion-button fill="clear" (click)="closeTriage()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="study-content">
      <div class="study-shell ion-padding km-planner-wrap">
        <section class="km-panel km-panel--composer">
          <p class="km-panel-subtitle">{{ triageNote()?.text }}</p>
          <ion-item lines="none" class="km-form-field">
            <ion-select label="Add to plan" labelPlacement="stacked" [value]="triagePlanId()" (ionChange)="setTriagePlan($event.detail.value)">
              <ion-select-option *ngFor="let plan of plans()" [value]="plan.id">{{ plan.title }}</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-button class="km-btn km-primary-btn" expand="block" (click)="submitTriage()" [disabled]="saving()">
            {{ saving() ? 'Moving...' : 'Create Task' }}
          </ion-button>
        </section>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
