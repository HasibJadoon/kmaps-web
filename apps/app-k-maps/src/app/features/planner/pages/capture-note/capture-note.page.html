<ion-header class="study-toolbar-wrap">
  <ion-toolbar class="study-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()" aria-label="Back to notes">
        <ion-icon name="chevron-back-outline" slot="start"></ion-icon>
        Notes
      </ion-button>
    </ion-buttons>
    <ion-title>Note</ion-title>
    <ion-buttons slot="end">
      <span
        class="km-save-state"
        [class.km-save-state--on]="saveState() !== 'idle'"
        [class.km-save-state--error]="saveState() === 'error'"
      >
        {{
          saveState() === 'saving' ? 'Saving…' :
          saveState() === 'saved'  ? 'Saved'   :
          saveState() === 'error'  ? 'Save failed' : ''
        }}
      </span>
      <ion-button fill="clear" aria-label="Add to SRS" (click)="addToSrs()">
        <ion-icon name="albums-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="study-content" [fullscreen]="true">
  <div class="km-note-toolbar" role="toolbar" aria-label="Formatting">
    <div class="km-note-toolbar__group">
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['h1']"
        (mousedown)="onTool($event, 'h1')" aria-label="Heading 1">H1</button>
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['h2']"
        (mousedown)="onTool($event, 'h2')" aria-label="Heading 2">H2</button>
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['h3']"
        (mousedown)="onTool($event, 'h3')" aria-label="Heading 3">H3</button>
    </div>

    <span class="km-note-toolbar__sep" aria-hidden="true"></span>

    <div class="km-note-toolbar__group">
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['bold']"
        (mousedown)="onTool($event, 'bold')" aria-label="Bold"><strong>B</strong></button>
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['italic']"
        (mousedown)="onTool($event, 'italic')" aria-label="Italic"><em>I</em></button>
      <button type="button" class="km-note-tool km-note-tool--underline" [class.km-note-tool--on]="active()['underline']"
        (mousedown)="onTool($event, 'underline')" aria-label="Underline">U</button>
      <button type="button" class="km-note-tool km-note-tool--strike" [class.km-note-tool--on]="active()['strike']"
        (mousedown)="onTool($event, 'strike')" aria-label="Strikethrough">S</button>
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['code']"
        (mousedown)="onTool($event, 'code')" aria-label="Inline code">&lt;/&gt;</button>
    </div>

    <span class="km-note-toolbar__sep" aria-hidden="true"></span>

    <div class="km-note-toolbar__group">
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['bullet']"
        (mousedown)="onTool($event, 'bullet')" aria-label="Bullet list">&bull;</button>
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['ordered']"
        (mousedown)="onTool($event, 'ordered')" aria-label="Numbered list">1.</button>
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['checklist']"
        (mousedown)="onTool($event, 'checklist')" aria-label="Checklist">&#10003;</button>
    </div>

    <span class="km-note-toolbar__sep" aria-hidden="true"></span>

    <div class="km-note-toolbar__group">
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['quote']"
        (mousedown)="onTool($event, 'quote')" aria-label="Quote">&ldquo;</button>
      <button type="button" class="km-note-tool" [class.km-note-tool--on]="active()['callout']"
        (mousedown)="onTool($event, 'callout')" aria-label="Callout">&#128161;</button>
      <button type="button" class="km-note-tool" (mousedown)="onTool($event, 'divider')"
        aria-label="Divider">&mdash;</button>
    </div>
  </div>

  @if (loading()) {
    <div class="km-note-loading">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  }

  @if (editorError()) {
    <div class="km-note-error">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <p>The editor failed to load. Go back and reopen this note.</p>
    </div>
  }

  <input
    type="text"
    class="km-note-title"
    [class.km-note-title--hidden]="loading() || editorError()"
    placeholder="Title"
    enterkeyhint="next"
    autocapitalize="sentences"
    spellcheck="true"
    [ngModel]="title()"
    (ngModelChange)="onTitleInput($event)"
  />

  <div #editorHost class="km-note-doc km-doc-editor-el" [class.km-note-doc--hidden]="loading() || editorError()"></div>
</ion-content>
