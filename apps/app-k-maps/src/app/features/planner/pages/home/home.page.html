<ion-header class="study-toolbar-wrap">
  <ion-toolbar class="study-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/workbench" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Planner</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" aria-label="Home" (click)="goHome()">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="study-content" [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="study-shell ion-padding km-planner-wrap">
    <section class="km-panel km-panel--hero">
      <div>
        <p class="km-panel-kicker">{{ todayLabel }}</p>
        <h1>Your planner</h1>
        <p class="km-panel-subtitle">Plan, schedule and review across every K-MAPS domain.</p>
      </div>
    </section>

    <button
      type="button"
      class="km-hub-card"
      *ngFor="let card of cards()"
      [style.--km-accent]="card.accent"
      (click)="open(card.route)"
    >
      <span class="km-hub-icon">
        <ion-icon [icon]="card.icon"></ion-icon>
      </span>
      <span class="km-hub-body">
        <span class="km-hub-title">{{ card.title }}</span>
        <span class="km-hub-caption">{{ card.caption }}</span>
      </span>
      <ion-icon class="km-hub-chevron" name="chevron-forward-outline"></ion-icon>
    </button>
  </div>
</ion-content>
