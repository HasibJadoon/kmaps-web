<ion-header class="study-toolbar-wrap">
  <ion-toolbar class="study-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/planner" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Plans</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="toggleArchived()" [attr.aria-label]="showArchived() ? 'Hide archived' : 'Show archived'">
        <ion-icon [name]="showArchived() ? 'eye-outline' : 'eye-off-outline'" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button fill="clear" aria-label="New plan" (click)="openCreate()">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="study-toolbar">
    <ion-segment class="km-status-segment" scrollable [value]="domainFilter()" (ionChange)="setDomainFilter($event.detail.value)">
      <ion-segment-button value="all"><ion-label>All</ion-label></ion-segment-button>
      <ion-segment-button *ngFor="let domain of domains" [value]="domain.id">
        <ion-label>{{ domain.label }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="study-content" [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="study-shell ion-padding km-planner-wrap">
    <ng-container *ngIf="loading(); else plansLoaded">
      <section class="km-panel">
        <ion-skeleton-text animated style="width: 100%; height: 4.6rem; margin-bottom: 0.5rem"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 100%; height: 4.6rem; margin-bottom: 0.5rem"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 100%; height: 4.6rem"></ion-skeleton-text>
      </section>
    </ng-container>

    <ng-template #plansLoaded>
      <ng-container *ngIf="visiblePlans().length > 0; else emptyPlans">
        <button
          type="button"
          class="km-panel km-plan-card"
          *ngFor="let plan of visiblePlans()"
          [style.--km-domain]="domainColor(planDomainOf(plan))"
          (click)="openPlan(plan)"
        >
          <div class="km-plan-card-head">
            <span class="km-domain-chip">{{ domainLabel(planDomainOf(plan)) }}</span>
            <span class="km-plan-card-status">{{ statusLabels[plan.status] }}</span>
          </div>
          <h2 class="km-plan-card-title">{{ plan.title }}</h2>
          <p class="km-plan-card-desc" *ngIf="plan.description_md">{{ plan.description_md }}</p>
          <p class="km-plan-card-meta">{{ plan.plan_type }} · P{{ plan.priority }}</p>
        </button>
      </ng-container>

      <ng-template #emptyPlans>
        <section class="km-panel km-empty-state">
          <h3>No plans yet</h3>
          <p>Create a plan for Quran, Arabic, Worldview or Content work.</p>
          <ion-button class="km-btn km-primary-btn" (click)="openCreate()">New Plan</ion-button>
        </section>
      </ng-template>
    </ng-template>
  </div>
</ion-content>

<ion-modal class="km-source-metadata-modal" [isOpen]="createOpen()" (ionModalDidDismiss)="closeCreate()">
  <ng-template>
    <ion-header>
      <ion-toolbar class="study-toolbar">
        <ion-title>New Plan</ion-title>
        <ion-buttons slot="end">
          <ion-button fill="clear" (click)="closeCreate()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="study-content">
      <div class="study-shell ion-padding km-planner-wrap">
        <section class="km-panel km-panel--composer">
          <ion-item lines="none" class="km-form-field">
            <ion-input [formControl]="newTitle" label="Plan title" labelPlacement="stacked" placeholder="e.g. Memorise Juz 30"></ion-input>
          </ion-item>
          <p class="km-field-label">Domain</p>
          <ion-segment class="km-status-segment" scrollable [value]="newDomain()" (ionChange)="setNewDomain($event.detail.value)">
            <ion-segment-button *ngFor="let domain of domains" [value]="domain.id">
              <ion-label>{{ domain.label }}</ion-label>
            </ion-segment-button>
          </ion-segment>
          <ion-button class="km-btn km-primary-btn" expand="block" (click)="submitCreate()" [disabled]="saving()">
            {{ saving() ? 'Creating...' : 'Create Plan' }}
          </ion-button>
        </section>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
