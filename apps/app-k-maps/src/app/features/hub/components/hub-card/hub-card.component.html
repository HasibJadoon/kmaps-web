
    <ion-card
      button
      class="km-ion-card hc"
      [class.hc--new]="card.badge === 'NEW'"
      [class.hc--updated]="card.badge === 'UPDATED'"
      [style.--accent]="card.accentColor ?? 'rgba(201,168,76,0.15)'"
      (click)="cardClick.emit(card)"
      [attr.aria-label]="'Open ' + card.title"
    >
      @if (card.badge) {
        <span class="hc__badge">{{ card.badge }}</span>
      }
      @if (count !== null) {
        <span class="hc__count">{{ count }}</span>
      }
      <ion-card-header>
        <div class="hc__glyph">{{ card.glyph ?? card.icon }}</div>
        <ion-card-subtitle class="hc__tag">{{ card.tag }}</ion-card-subtitle>
        <ion-card-title class="hc__title">{{ card.title }}</ion-card-title>
      </ion-card-header>
      @if (showDesc) {
        <ion-card-content class="hc__desc">
          {{ card.description }}
        </ion-card-content>
      }
    </ion-card>
