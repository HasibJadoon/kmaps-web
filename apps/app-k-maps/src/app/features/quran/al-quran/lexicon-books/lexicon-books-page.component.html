<!-- Native Ionic header — handles iOS safe-area + status-bar padding
     automatically so the title is never clipped. -->
<ion-header class="lxb-header">
  <ion-toolbar class="lxb-toolbar" dir="rtl">
    <ion-buttons slot="end">
      <ion-button (click)="goBack()" aria-label="الرجوع">
        <ion-icon name="chevron-back-outline" slot="icon-only" class="lxb-back-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="lxb-toolbar__title">المكتبة</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="openFilterSheet()" aria-label="تصفية" [class.lxb-filter-btn--active]="filter() !== 'all'">
        <ion-icon name="options-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="lxb-content" [fullscreen]="false">
  <section class="lxb-page" dir="rtl">

    @if (loading()) {
      <p class="lxb-muted">…</p>
    } @else {
      <ul class="lxb-list">
        @for (b of filteredBooks(); track b.slug) {
          <li>
            <button class="lxb-card"
                    [class.lxb-card--academic]="b.kind === 'scholarship'"
                    [attr.data-genre]="b.genre"
                    type="button"
                    (click)="openBook(b)">
              <!-- Decorative layers (home-card visual language) -->
              <span class="lxb-card__shimmer" aria-hidden="true"></span>
              <span class="lxb-card__bottom-glow" aria-hidden="true"></span>

              @if (b.kind === 'scholarship') {
                <span class="lxb-card__badge">أكاديمي · {{ b.genre_ar || 'Academic' }}</span>
              }
              <div class="lxb-card__head">
                <h2 class="lxb-card__title">{{ b.title_ar }}</h2>
                @if (b.kind !== 'scholarship') {
                  <p class="lxb-card__author">{{ b.author }}{{ b.year ? ' · ' + b.year : '' }}</p>
                }
              </div>
              <p class="lxb-card__stats">
                @if (b.kind === 'scholarship') {
                  {{ b.roots | number }} قراءة
                } @else {
                  {{ b.roots | number }} جذرًا
                }
              </p>
            </button>
          </li>
        }
      </ul>
    }

  </section>
</ion-content>
