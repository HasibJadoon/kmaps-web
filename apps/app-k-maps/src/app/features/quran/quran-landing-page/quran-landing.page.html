<ion-content [fullscreen]="true" class="quran-landing-content">
  <div class="quran-landing">
    <header class="page-header">
      <div class="page-header__ornament">بسم الله الرحمن الرحيم</div>
      <h1 class="page-header__title">Quran</h1>
      <p class="page-header__subtitle">Choose a Quran workspace</p>
    </header>

    <main class="quran-cards" #cardsRow>
      @for (mod of modules; track mod.id) {
        <button
          class="km-module-card"
          [class]="'km-module-card--' + mod.id"
          (click)="navigate(mod.route)"
          [attr.aria-label]="'Open ' + mod.label"
          type="button"
        >
          <div class="km-module-card__artwork">
            <span class="km-module-card__glyph">{{ mod.glyph }}</span>
            <div class="km-module-card__shimmer"></div>
          </div>
          <div class="km-module-card__bottom-glow"></div>
          <span class="km-module-card__label">{{ mod.label }}</span>
        </button>
      }
    </main>
  </div>
</ion-content>
