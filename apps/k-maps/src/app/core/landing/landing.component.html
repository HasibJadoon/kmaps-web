<div class="landing" #page>

  <!-- Ambient particles -->
  <div class="landing__particles" aria-hidden="true">
    @for (i of particles; track i) {
      <span class="particle" [style.--i]="i"></span>
    }
  </div>

  <!-- Candle left -->
  <div class="landing__candle landing__candle--left" aria-hidden="true">
    <div class="candle-flame"><div class="flame-inner"></div></div>
    <div class="candle-body"></div>
    <div class="candle-glow"></div>
  </div>

  <!-- Candle right -->
  <div class="landing__candle landing__candle--right" aria-hidden="true">
    <div class="candle-flame"><div class="flame-inner"></div></div>
    <div class="candle-body"></div>
    <div class="candle-glow"></div>
  </div>

  <div class="landing__concept-graph" aria-hidden="true">
    <svg class="landing__concept-links" viewBox="0 0 100 100" preserveAspectRatio="none">
      @for (link of conceptLinks; track link.id) {
        <line
          [attr.x1]="link.x1"
          [attr.y1]="link.y1"
          [attr.x2]="link.x2"
          [attr.y2]="link.y2"
        />
      }
    </svg>

    @for (node of conceptNodes; track node.id) {
      <div
        #conceptNode
        class="landing__concept-node"
        [class]="'landing__concept-node landing__concept-node--' + node.tone + ' landing__concept-node--' + node.size"
        [style.left.%]="node.x"
        [style.top.%]="node.y"
      >
        <span class="landing__concept-core"></span>
        <span class="landing__concept-label">{{ node.label }}</span>
      </div>
    }
  </div>

  <!-- Logo -->
  <header class="landing__header" #logo>
    <div class="landing__logo-wrap">
      <div class="landing__logo-emblem" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="url(#goldRing)" stroke-width="1"/>
          <path d="M24 8 L28 18 L38 18 L30 26 L33 36 L24 30 L15 36 L18 26 L10 18 L20 18 Z"
                fill="url(#goldStar)" opacity="0.9"/>
          <defs>
            <linearGradient id="goldRing" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.4"/>
              <stop offset="50%" stop-color="#e8c96a"/>
              <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.4"/>
            </linearGradient>
            <linearGradient id="goldStar" x1="10" y1="8" x2="38" y2="36">
              <stop offset="0%" stop-color="#e8c96a"/>
              <stop offset="100%" stop-color="#c9a84c"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="landing__logo-text">
        <span class="logo-name">K-MAPS</span>
        <span class="logo-sub">Knowledge Command Center</span>
      </div>
    </div>
  </header>

  <p class="landing__tagline" #subtitle>
    Quranic Lens &nbsp;|&nbsp; Worldview Mapping
  </p>

  <!-- Module cards -->
  <main class="landing__cards" #cardsRow>
    @for (mod of modules; track mod.id) {
      <button
        class="km-module-card"
        [class]="'km-module-card--' + mod.id"
        (click)="navigate(mod.route)"
        [attr.aria-label]="'Open ' + mod.label"
      >
        <div class="km-module-card__artwork">
          <span class="km-module-card__glyph">{{ mod.glyph }}</span>
          <div class="km-module-card__shimmer"></div>
        </div>
        <div class="km-module-card__bottom-glow"></div>
        <span class="km-module-card__label">{{ mod.label }}</span>
      </button>
    }
  </main>

  <!-- Domain footer -->
  <footer class="landing__footer" #domainLabel>
    <span class="km-divider-text">Select a Domain</span>
  </footer>

</div>
