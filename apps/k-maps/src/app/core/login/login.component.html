<div class="login-page">
  <div class="login-card">
    <div class="login-card__logo">K·Maps</div>
    <h1 class="login-card__title">Sign in</h1>
    <p class="login-card__sub">Access your knowledge hub</p>

    <form class="login-form" (ngSubmit)="submit()" #f="ngForm">
      <div class="login-form__field">
        <label class="login-form__label" for="email">Email</label>
        <input
          id="email"
          class="login-form__input"
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        />
      </div>
      <div class="login-form__field">
        <label class="login-form__label" for="password">Password</label>
        <input
          id="password"
          class="login-form__input"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        />
      </div>

      @if (error()) {
        <p class="login-form__error">{{ error() }}</p>
      }

      <button class="login-form__submit" type="submit" [disabled]="loading()">
        @if (loading()) { Signing in… } @else { Sign in }
      </button>
    </form>
  </div>
</div>
