<div class="jump" [class.is-open]="open()">

  <button type="button" class="jump__step" (click)="nextRoot.emit()"
          title="الجذر التالي (←)" aria-label="next root">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- The root itself is the search field: reading it and changing it are the
       same control, so there is no separate box to find. -->
  @if (open()) {
    <input #field
           class="jump__field"
           type="search"
           [value]="query()"
           (input)="onQuery($any($event.target).value)"
           (keydown)="onKey($event)"
           [placeholder]="root() || 'ابحث عن جذر…'"
           dir="rtl"
           aria-label="search roots" />
  } @else {
    <button type="button" class="jump__current" (click)="openField()"
            [disabled]="!hasRoots()"
            title="اكتب للانتقال إلى جذر آخر">{{ root() || '—' }}</button>
  }

  <button type="button" class="jump__step" (click)="prevRoot.emit()"
          title="الجذر السابق (→)" aria-label="previous root">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path d="M10 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  @if (open()) {
    <ul class="jump__list" role="listbox">
      @if (!matches().length) {
        <li class="jump__empty">لا نتائج</li>
      }
      @for (m of matches(); track m.root_norm; let i = $index) {
        <li>
          <button type="button" class="jump__hit"
                  [class.is-cursor]="i === cursor()"
                  [class.is-current]="m.root_norm === root()"
                  role="option" [attr.aria-selected]="i === cursor()"
                  (click)="choose(m.root_norm)">
            <span class="jump__hit-ar" dir="rtl">{{ m.root_text || m.root_norm }}</span>
            @if (m.page_start) { <span class="jump__hit-page">ص {{ m.page_start }}</span> }
          </button>
        </li>
      }
    </ul>
  }
</div>
