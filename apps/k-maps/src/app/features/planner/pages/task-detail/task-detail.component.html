<div class="kp-page">
  @if (loading()) {
    <div class="kp-card"><div class="kp-skeleton" style="height: 9rem"></div></div>
  } @else if (error() && !task()) {
    <div class="kp-card kp-empty">
      <h3>Something went wrong</h3>
      <p class="kp-muted">{{ error() }}</p>
      <button type="button" class="kp-btn kp-btn--primary" style="margin-top: 0.8rem" (click)="retry()">Retry</button>
    </div>
  } @else if (task()) {
    <header class="kp-page-head">
      <div>
        <button type="button" class="kp-btn kp-btn--ghost kp-btn--sm" style="margin-bottom: 0.6rem" (click)="back()">← Back</button>
        <p class="kp-page-eyebrow">
          <span class="kp-dot" style="display:inline-block;vertical-align:middle;margin-right:0.4rem" [style.--kp-domain]="domainColor()"></span>
          {{ domainLabel() }}@if (plan()) { · {{ plan()?.title }} }
        </p>
        <h1 class="kp-page-title">Task</h1>
      </div>
    </header>

    <div class="kp-card">
      <div class="kp-field">
        <label class="kp-label" for="kp-task-title">Title</label>
        <input id="kp-task-title" class="kp-input" [(ngModel)]="title" />
      </div>

      <div class="kp-field">
        <label class="kp-label" for="kp-task-notes">Notes</label>
        <textarea id="kp-task-notes" class="kp-textarea" rows="5" [(ngModel)]="description"
          placeholder="Details, links and notes for this task"></textarea>
      </div>

      <div class="kp-field-row">
        <div class="kp-field">
          <label class="kp-label" for="kp-task-status">Status</label>
          <select id="kp-task-status" class="kp-select" [(ngModel)]="status">
            @for (item of taskStatuses; track item) { <option [value]="item">{{ statusLabels[item] }}</option> }
          </select>
        </div>
        <div class="kp-field">
          <label class="kp-label" for="kp-task-type">Type</label>
          <select id="kp-task-type" class="kp-select" [(ngModel)]="type">
            @for (item of taskTypes; track item) { <option [value]="item">{{ item }}</option> }
          </select>
        </div>
      </div>

      <div class="kp-field-row">
        <div class="kp-field">
          <label class="kp-label" for="kp-task-prio">Priority</label>
          <select id="kp-task-prio" class="kp-select" [(ngModel)]="priority">
            @for (level of priorities; track level) { <option [ngValue]="level">P{{ level }} · {{ priorityLabelFor(level) }}</option> }
          </select>
        </div>
        <div class="kp-field">
          <label class="kp-label" for="kp-task-due">Due date</label>
          <input id="kp-task-due" type="date" class="kp-input" [(ngModel)]="due" />
        </div>
      </div>

      <div class="kp-field-row">
        <div class="kp-field">
          <label class="kp-label" for="kp-task-est">Estimate (min)</label>
          <input id="kp-task-est" type="number" class="kp-input" [(ngModel)]="estimate" />
        </div>
        <div class="kp-field">
          <label class="kp-label" for="kp-task-act">Actual (min)</label>
          <input id="kp-task-act" type="number" class="kp-input" [(ngModel)]="actual" />
        </div>
      </div>

      @if (error()) { <p class="kp-muted" style="color:#ff8f8f">{{ error() }}</p> }

      <div style="display:flex;gap:0.55rem;margin-top:0.6rem">
        <button type="button" class="kp-btn kp-btn--primary" [disabled]="saving() || !title.trim()" (click)="save()">
          {{ saving() ? 'Saving…' : 'Save task' }}
        </button>
        <button type="button" class="kp-btn" [disabled]="saving() || status === 'done'" (click)="markComplete()">
          Mark complete
        </button>
      </div>
    </div>
  }
</div>
