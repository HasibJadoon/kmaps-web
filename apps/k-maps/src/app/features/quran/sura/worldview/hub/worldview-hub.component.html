<km-quran-page-shell breadcrumb="Worldview" [title]="'Surah ' + surahId()" (goBack)="goBack()">
  @if (loading()) {
    <div class="wv-hub__loading">
      <div class="wv-hub__spinner"></div>
      <p>Loading worldview…</p>
    </div>
  }
  @if (error()) {
    <div class="wv-hub__error">{{ error() }}</div>
  }
  @if (!loading() && !error()) {
    <div class="wv-hub__counts">
      <div class="wv-count">
        <span class="wv-count__n">{{ counts()?.nodes ?? 0 }}</span>
        <span class="wv-count__l">Nodes</span>
      </div>
      <div class="wv-count">
        <span class="wv-count__n">{{ counts()?.sources ?? 0 }}</span>
        <span class="wv-count__l">Sources</span>
      </div>
      <div class="wv-count">
        <span class="wv-count__n">{{ counts()?.notes ?? 0 }}</span>
        <span class="wv-count__l">Notes</span>
      </div>
      <div class="wv-count">
        <span class="wv-count__n">{{ counts()?.documents ?? 0 }}</span>
        <span class="wv-count__l">Docs</span>
      </div>
    </div>
    <div class="wv-hub__tiles" (click)="$event.stopPropagation()">
      @for (a of actions; track a.id) {
        <km-action-icon-tile [config]="a" (tileClick)="navigate(a.id)" />
      }
    </div>
  }
</km-quran-page-shell>
