<div class="surah-actions" (click)="$event.stopPropagation()">
  <div class="surah-actions__divider"></div>
  <div class="surah-actions__tiles">
    @for (action of actions; track action.id) {
      <km-action-icon-tile
        [config]="action"
        (tileClick)="navigate(action.id)"
      />
    }
  </div>
</div>
