<km-quran-page-shell breadcrumb="Surah {{ surahId() }}" title="Linguistics" (goBack)="back()">

  <header class="lc-header">
    <p class="lc-header__eyebrow">Surah {{ surahId() }}</p>
    <h1 class="lc-header__title">Linguistics</h1>
    <p class="lc-header__sub">Grammatical, rhetorical &amp; interpretive sciences</p>
    <div class="lc-header__rule"></div>
  </header>

  <div class="lc-grid">

    <!-- Near Synonyms -->
    <button class="lc__card lc__card--1" #lingCard (click)="goTo('near-synonyms')">
      <div class="lc__card-artwork">
        <span class="lc__glyph">ن</span>
        <div class="lc__shimmer"></div>
      </div>
      <div class="lc__bottom-glow"></div>
      <div class="lc__card-body">
        <span class="lc__tag">Lexical</span>
        <span class="lc__card-title">Near Synonyms</span>
        <p class="lc__card-desc">Quranic synonym clusters for Surah {{ surahId() }}</p>
      </div>
    </button>

    <!-- Morphology -->
    <button class="lc__card lc__card--2" #lingCard (click)="goTo('morphology')">
      <div class="lc__card-artwork">
        <span class="lc__glyph">ص</span>
        <div class="lc__shimmer"></div>
      </div>
      <div class="lc__bottom-glow"></div>
      <div class="lc__card-body">
        <span class="lc__tag">Morphology</span>
        <span class="lc__card-title">Ṣarf</span>
        <p class="lc__card-desc">Word roots, forms &amp; patterns</p>
      </div>
    </button>

    <!-- Iʿrāb -->
    <button class="lc__card lc__card--6" #lingCard (click)="goTo('near-synonyms')">
      <div class="lc__card-artwork">
        <span class="lc__glyph">ع</span>
        <div class="lc__shimmer"></div>
      </div>
      <div class="lc__bottom-glow"></div>
      <div class="lc__card-body">
        <span class="lc__tag">Grammar</span>
        <span class="lc__card-title">Iʿrāb</span>
        <p class="lc__card-desc">Grammatical parsing &amp; case analysis</p>
      </div>
    </button>

    <!-- Balāgha -->
    <button class="lc__card lc__card--3" #lingCard (click)="goTo('near-synonyms')">
      <div class="lc__card-artwork">
        <span class="lc__glyph">ب</span>
        <div class="lc__shimmer"></div>
      </div>
      <div class="lc__bottom-glow"></div>
      <div class="lc__card-body">
        <span class="lc__tag">Rhetoric</span>
        <span class="lc__card-title">Balāgha</span>
        <p class="lc__card-desc">Eloquence &amp; stylistic devices</p>
      </div>
    </button>

    <!-- Translation -->
    <button class="lc__card lc__card--4" #lingCard (click)="goTo('near-synonyms')">
      <div class="lc__card-artwork">
        <span class="lc__glyph">ت</span>
        <div class="lc__shimmer"></div>
      </div>
      <div class="lc__bottom-glow"></div>
      <div class="lc__card-body">
        <span class="lc__tag">Translation</span>
        <span class="lc__card-title">Tarjama</span>
        <p class="lc__card-desc">Nuances, word choices &amp; near-synonyms</p>
      </div>
    </button>

    <!-- Tafsīr -->
    <button class="lc__card lc__card--5" #lingCard (click)="goTo('near-synonyms')">
      <div class="lc__card-artwork">
        <span class="lc__glyph">ف</span>
        <div class="lc__shimmer"></div>
      </div>
      <div class="lc__bottom-glow"></div>
      <div class="lc__card-body">
        <span class="lc__tag">Commentary</span>
        <span class="lc__card-title">Tafsīr</span>
        <p class="lc__card-desc">Classical &amp; thematic commentary</p>
      </div>
    </button>

  </div>

</km-quran-page-shell>
