<div class="qrs-shell">

  <!-- ═══════════════════════════════════════════
       HEADER CONTAINER
  ═══════════════════════════════════════════ -->
  <header class="qrs-header">

    <!-- Row 1: Logo + Search + Actions -->
    <div class="qrs-header__top">

      <div class="qrs-header__start">
        <button class="qrs-icon-btn" type="button" (click)="goHome()" title="الرئيسية">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="6" height="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <rect x="10.5" y="1.5" width="6" height="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <rect x="1.5" y="10.5" width="6" height="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <rect x="10.5" y="10.5" width="6" height="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
        </button>

        <label class="qrs-search" aria-label="البحث في القرآن الكريم">
          <span class="qrs-search__icon" aria-hidden="true">⌕</span>
          <input lang="ar"
            class="qrs-search__input"
            type="search"
            placeholder="البحث في القرآن الكريم… أو ٤٤:٣"
            dir="rtl"
            aria-label="البحث في القرآن الكريم"
            (keydown.enter)="onSearchSubmit($any($event.target).value)"
          />
          <kbd class="qrs-search__kbd">/</kbd>
        </label>

      </div>

      <div class="qrs-header__center">
        <div class="qrs-logo">
          <div class="qrs-logo__deco" aria-hidden="true">
            <span class="qrs-logo__deco-line qrs-logo__deco-line--left"></span>
            <span class="qrs-logo__deco-gem">◆</span>
            <span class="qrs-logo__deco-line qrs-logo__deco-line--left"></span>
          </div>
          <div class="qrs-logo__brand">
            <span class="qrs-logo__name">K-MAPS</span>
            <span class="qrs-logo__subtitle">QURAN RESEARCHER</span>
          </div>
          <div class="qrs-logo__deco" aria-hidden="true">
            <span class="qrs-logo__deco-line qrs-logo__deco-line--right"></span>
            <span class="qrs-logo__deco-gem">◆</span>
            <span class="qrs-logo__deco-line qrs-logo__deco-line--right"></span>
          </div>
        </div>
      </div>

      <div class="qrs-header__end">
        <button class="qrs-action-btn" type="button" title="المفضلة">
          <svg class="qrs-action-btn__svg" width="15" height="17" viewBox="0 0 15 17" fill="none" aria-hidden="true">
            <path d="M1 1h13v14l-6.5-3.5L1 15V1z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
          </svg>
          <span class="qrs-action-btn__label">المفضلة</span>
        </button>

        <button class="qrs-icon-btn" type="button" title="الإعدادات">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="2.4" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8.5 1v2M8.5 14v2M1 8.5h2M14 8.5h2M3.1 3.1l1.4 1.4M12.5 12.5l1.4 1.4M12.5 4.5l1.4-1.4M3.1 13.9l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="qrs-header__sep"></div>

    <!-- Row 2: Section Tabs -->
    <nav lang="ar" class="qrs-tabs" dir="rtl" aria-label="أقسام باحث القرآن">

      <a
        class="qrs-tab"
        routerLink="al-quran"
        routerLinkActive="qrs-tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg class="qrs-tab__svg" width="15" height="16" viewBox="0 0 15 16" fill="none" aria-hidden="true">
          <rect x="1.5" y="1" width="12" height="14" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/>
          <line x1="4.5" y1="5" x2="10.5" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="4.5" y1="8" x2="10.5" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="4.5" y1="11" x2="8.5" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span class="qrs-tab__label">القرآن</span>
      </a>

      @for (tab of tabs; track tab.id) {
        <a
          class="qrs-tab"
          [routerLink]="'/quran/' + tab.routePath"
          routerLinkActive="qrs-tab--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="qrs-tab__icon" aria-hidden="true">{{ tab.icon }}</span>
          <span class="qrs-tab__label">{{ tab.labelAr }}</span>
        </a>
      }

      <!-- Muṣḥaf navigation. On the tab row, not the header's left column: there
           it wrapped into three stacked lines and collided with the logo. Parked
           at the row's far end opposite the tabs. Drives the reader via the URL. -->
      @if (showMushafNav()) {
        <div class="qrs-nav" aria-label="Mushaf navigation" dir="ltr">
          <label class="qrs-nav__field">
            <span>Surah</span>
            <select [value]="currentSurah()" (change)="goToSurah($any($event.target).value)">
              @for (su of quranState.surahs(); track su.surahNumber) {
                <option [value]="su.surahNumber" [selected]="su.surahNumber === currentSurah()">
                  {{ su.surahNumber }}. {{ su.englishName }}
                </option>
              }
            </select>
          </label>

          <label class="qrs-nav__field qrs-nav__field--num">
            <span>Verse</span>
            <input type="number" min="1" [max]="verseCount()"
                   [value]="currentVerse()"
                   (change)="goToVerse($any($event.target).value)" />
            <em>/ {{ verseCount() }}</em>
          </label>

          <label class="qrs-nav__field qrs-nav__field--num">
            <span>Page</span>
            <input type="number" min="1" max="604"
                   [value]="currentPage() ?? ''"
                   (change)="goToPage($any($event.target).value)" />
          </label>
        </div>
      }

    </nav>

    <div class="qrs-header__sep qrs-header__sep--thick"></div>
  </header>

  <!-- ═══════════════════════════════════════════
       PAGE CONTAINER
  ═══════════════════════════════════════════ -->
  <main class="qrs-page" #pageSlot>
    <router-outlet (activate)="onRouteActivate()" />
  </main>

</div>
