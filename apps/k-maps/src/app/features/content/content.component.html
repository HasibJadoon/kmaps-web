<div class="km-page" #page>
  <km-home-plane-button />
  <km-back-button />

  <div class="km-page__inner">

    <!-- Header -->
    <header class="km-page-header">
      <p class="km-page-header__eyebrow">Editorial Dashboard</p>
      <h1 class="km-page-header__title">Content</h1>
      <p class="km-page-header__subtitle">Publishing &amp; Editorial</p>
      <div class="km-page-header__rule"></div>
    </header>

    <!-- Status Bar -->
    <div class="km-status-bar">
      <div class="km-status-bar__indicator km-status-bar__indicator--live"></div>
      <span class="km-status-bar__label">Episode in Production</span>
      <span class="km-status-bar__divider">·</span>
      <span class="km-status-bar__meta">Editorial workflow active</span>
    </div>

    <!-- Cards Grid -->
    <div class="km-grid">
      @for (section of sections; track section.label) {
        <div class="km-card" [class.km-card--featured]="section.tag === 'ACTIVE'">
          <div class="km-card__tag">{{ section.tag }}</div>
          <div class="km-card__icon">{{ section.icon }}</div>
          <h3 class="km-card__title">{{ section.label }}</h3>
          <p class="km-card__desc">{{ section.desc }}</p>
          <div class="km-card__arrow">→</div>
        </div>
      }
    </div>

  </div>
</div>
