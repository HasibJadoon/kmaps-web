name: Deploy Ionic App to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm install --legacy-peer-deps --workspace apps/app-k-maps --include-workspace-root=false
          npm run build -w apps/app-k-maps

      - name: Deploy to Cloudflare Pages
        run: |
          # Sanitize commit message — Cloudflare's API rejects some valid
          # UTF-8 glyphs (box-drawing chars, certain dashes) with
          # "Invalid commit message" errors. Restrict to ASCII printables.
          SAFE_MSG=$(git log -1 --pretty=%s | LC_ALL=C tr -d -c '\11\12\15\40-\176' | head -c 240)
          [ -z "$SAFE_MSG" ] && SAFE_MSG="Deploy $(git rev-parse --short HEAD)"
          echo "Sanitized commit message: $SAFE_MSG"
          for i in 1 2 3; do
            npx wrangler@4.66.0 pages deploy apps/app-k-maps/www \
              --project-name app-k-maps \
              --branch main \
              --commit-message "$SAFE_MSG" \
              --commit-hash "$(git rev-parse HEAD)" && exit 0
            echo "Deploy attempt $i failed. Retrying in 15s..."
            sleep 15
          done
          echo "Deploy failed after 3 attempts."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
