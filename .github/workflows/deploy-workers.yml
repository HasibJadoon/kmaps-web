name: Deploy Workers

# Cheap automatic deploys on free GitHub (owner, 2026-10-24): one job per push, deploying ONLY the workers the push
# changed — a change under workers/shared, package*.json or the deploy script deploys all — in the safe order
# (internal workers first, km-backend-worker, the one public API, last; see scripts/deploy-workers.sh). Tests and the
# changed workers' types run first; a failure deploys nothing. Pushes queue (never cancel), so no deploy is lost.
# By hand: Actions → Deploy Workers → Run workflow (a list of workers, or empty for all), or `npm run deploy:workers`.
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/deploy-workers.sh"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      workers:
        description: "Workers to deploy, space-separated (core quran …); empty = all"
        required: false
        default: ""

concurrency:
  group: deploy-workers
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Which workers changed
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.workers }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          ALL="core ar-linguistics studio content worldview quran arabic backend"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            w="${ASKED:-$ALL}"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            w="$ALL"
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER")
            if echo "$files" | grep -qE '^(workers/shared/|package(-lock)?\.json$|scripts/deploy-workers\.sh$|\.github/workflows/deploy-workers\.yml$)'; then
              w="$ALL"
            else
              w=$(echo "$files" | sed -nE 's#^workers/([^/]+)/.*#\1#p' | sort -u | grep -xE "$(echo $ALL | tr ' ' '|')" | tr '\n' ' ' || true)
            fi
          fi
          w=$(echo $w)
          echo "workers=$w" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${w:-nothing}"

      - if: steps.pick.outputs.workers != ''
        uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }

      - if: steps.pick.outputs.workers != ''
        run: npm ci

      - name: Tests, and the types of what deploys
        if: steps.pick.outputs.workers != ''
        env: { WORKERS: "${{ steps.pick.outputs.workers }}" }
        run: |
          npm test
          for w in $WORKERS; do echo "── tsc workers/$w"; npx tsc --noEmit -p "workers/$w/tsconfig.json"; done

      - name: Deploy
        if: steps.pick.outputs.workers != ''
        env:
          WORKERS: ${{ steps.pick.outputs.workers }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-workers.sh $WORKERS
