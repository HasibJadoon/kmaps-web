name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

# ── Deployment order ────────────────────────────────────────────────────────────
# Internal workers are deployed first (no public domain, service-binding only).
# km-backend-worker is ALWAYS deployed last — it is the single public API.
#
# Dependency graph:
#   core, al, studio  →  content  →  worldview  →  quran  →  planner, arabic  →  backend
#   (km-studio-worker has no service-binding deps — it only owns DB_ST)
# ────────────────────────────────────────────────────────────────────────────────

defaults:
  run:
    shell: bash

jobs:
  # ── Phase 1 (no deps) ──────────────────────────────────────────────────────
  deploy-core:
    name: "1 · km-core-worker"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/core
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-al:
    name: "1 · km-ar-linguistics-worker"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/ar-linguistics
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-studio:
    name: "1 · km-studio-worker"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/studio
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 2 (needs core) ───────────────────────────────────────────────────
  deploy-content:
    name: "2 · km-content-worker"
    runs-on: ubuntu-latest
    needs: [deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/content
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 3 (needs content + al + core) ───────────────────────────────────
  deploy-worldview:
    name: "3 · km-worldview-worker"
    runs-on: ubuntu-latest
    needs: [deploy-content, deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/worldview
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-quran:
    name: "3 · km-quran-worker"
    runs-on: ubuntu-latest
    needs: [deploy-al, deploy-content, deploy-worldview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/quran
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 4 (needs quran + core) ──────────────────────────────────────────
  deploy-planner:
    name: "4 · km-planner-worker"
    runs-on: ubuntu-latest
    needs: [deploy-quran, deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/planner
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-arabic:
    name: "4 · km-arabic-worker"
    runs-on: ubuntu-latest
    needs: [deploy-al, deploy-quran, deploy-planner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/arabic
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 5 — GATEWAY (always last) ───────────────────────────────────────
  deploy-backend:
    name: "5 · km-backend-worker  ← PUBLIC API"
    runs-on: ubuntu-latest
    needs: [deploy-quran, deploy-worldview, deploy-arabic, deploy-planner, deploy-content, deploy-al, deploy-studio, deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/backend
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
