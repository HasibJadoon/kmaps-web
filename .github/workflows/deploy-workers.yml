name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
      - ".github/workflows/_deploy-worker.yml"
      - ".github/workflows/_gate.yml"
  workflow_dispatch:

# ── Deployment order ────────────────────────────────────────────────────────────
# km-backend-worker is ALWAYS deployed last — it is the single public API, and
# that is the one ordering guarantee here that actually matters.
#
# The phases below are NOT a topological sort, because the real binding graph
# is cyclic — read the wrangler.toml files, not this comment, for the truth:
#   core → QURAN,  quran → WORLDVIEW,  worldview → CORE      (3-cycle)
#   arabic → PLANNER,  planner → ARABIC                      (2-cycle)
#   studio → CORE       (it is not dependency-free, as previously claimed)
#
# No ordering can satisfy a cyclic graph. In practice this is fine: all nine
# workers already exist in production, so service bindings resolve regardless
# of deploy order. Order only ever mattered for first-time creation. Treat the
# phases as sequencing, NOT as protection against a contract mismatch — if you
# change a service-binding contract, the old and new sides will be live
# simultaneously no matter what this file does.
# ────────────────────────────────────────────────────────────────────────────────

# Never run two deploy graphs at once, and never cancel one mid-flight:
# aborting between phases leaves the gateway live against a partially
# updated set of domain workers.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ── Phase 0 — GATE ─────────────────────────────────────────────────────────
  gate:
    uses: ./.github/workflows/_gate.yml

  # ── Phase 1 (no deps) ──────────────────────────────────────────────────────
  deploy-core:
    name: "1 · km-core-worker"
    needs: [gate]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: core }
    secrets: inherit

  deploy-al:
    name: "1 · km-ar-linguistics-worker"
    needs: [gate]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: ar-linguistics }
    secrets: inherit

  deploy-studio:
    name: "1 · km-studio-worker"
    needs: [gate]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: studio }
    secrets: inherit

  # ── Phase 2 ────────────────────────────────────────────────────────────────
  deploy-content:
    name: "2 · km-content-worker"
    needs: [gate, deploy-core]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: content }
    secrets: inherit

  # ── Phase 3 ────────────────────────────────────────────────────────────────
  deploy-worldview:
    name: "3 · km-worldview-worker"
    needs: [gate, deploy-content, deploy-core]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: worldview }
    secrets: inherit

  deploy-quran:
    name: "3 · km-quran-worker"
    needs: [gate, deploy-al, deploy-content, deploy-worldview]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: quran }
    secrets: inherit

  # ── Phase 4 ────────────────────────────────────────────────────────────────
  deploy-planner:
    name: "4 · km-planner-worker"
    needs: [gate, deploy-quran, deploy-core]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: planner }
    secrets: inherit

  deploy-arabic:
    name: "4 · km-arabic-worker"
    needs: [gate, deploy-al, deploy-quran, deploy-planner]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: arabic }
    secrets: inherit

  # ── Phase 5 — the public API, last ─────────────────────────────────────────
  deploy-backend:
    name: "5 · km-backend-worker  ← PUBLIC API"
    needs:
      [gate, deploy-quran, deploy-worldview, deploy-arabic, deploy-planner,
       deploy-content, deploy-al, deploy-studio, deploy-core]
    uses: ./.github/workflows/_deploy-worker.yml
    with: { worker: backend }
    secrets: inherit

  # ── Phase 6 — did we actually ship something that works? ───────────────────
  # A green wrangler deploy only means the upload succeeded. This is the only
  # step that checks the public API still answers afterwards.
  smoke:
    name: "6 · smoke — backend.k-maps.com/health"
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: /health must return 200 and ok:true
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
                   https://backend.k-maps.com/health || echo 000)
            body=$(cat /tmp/health.json 2>/dev/null || true)
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"ok":true'; then
              echo "healthy: $body"
              exit 0
            fi
            echo "attempt $i — HTTP $code — $body"
            sleep 10
          done
          echo "::error::public API unhealthy after deploy (last: HTTP $code $body)"
          exit 1
