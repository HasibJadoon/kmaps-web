name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

# ── Deployment order ────────────────────────────────────────────────────────────
# Internal workers are deployed first (no public domain, service-binding only).
# km-backend-worker is ALWAYS deployed last — it is the single public API, and
# that is the one ordering guarantee here that actually matters.
#
# The phases below are NOT a topological sort, because the real binding graph
# is cyclic — read the wrangler.toml files, not this comment, for the truth:
#   core → QURAN,  quran → WORLDVIEW,  worldview → CORE      (3-cycle)
#   arabic → PLANNER,  planner → ARABIC                      (2-cycle)
#   studio → CORE       (it is not dependency-free, as previously claimed)
#
# No ordering can satisfy a cyclic graph. In practice this is fine: all nine
# workers already exist in production, so service bindings resolve regardless
# of deploy order. Order only ever mattered for first-time creation. Treat the
# phases as sequencing, NOT as protection against a contract mismatch — if you
# change a service-binding contract, the old and new sides will be live
# simultaneously no matter what this file does.
# ────────────────────────────────────────────────────────────────────────────────

# Never run two deploy graphs at once, and never cancel one mid-flight:
# aborting between phases leaves the gateway live against a partially
# updated set of domain workers.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ── Phase 0 — GATE ─────────────────────────────────────────────────────────
  # Every worker below deploys straight to production. Until this job existed
  # the only thing standing between a commit and the public API was whether
  # wrangler happened to bundle it — nothing type-checked, so a worker whose
  # types no longer matched its D1 schema shipped and failed at runtime.
  #
  # One job, all nine workers, and every deploy `needs` it.
  typecheck:
    name: "0 · typecheck all workers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - name: unit tests
        run: npm test

      - name: tsc --noEmit
        run: |
          failed=()
          for w in core ar-linguistics studio content worldview quran planner arabic backend; do
            echo "── workers/$w"
            npx tsc --noEmit -p "workers/$w/tsconfig.json" || failed+=("$w")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::type errors in: ${failed[*]}"
            exit 1
          fi

  # ── Phase 1 (no deps) ──────────────────────────────────────────────────────
  deploy-core:
    name: "1 · km-core-worker"
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/core
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-al:
    name: "1 · km-ar-linguistics-worker"
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/ar-linguistics
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-studio:
    name: "1 · km-studio-worker"
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/studio
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 2 (needs core) ───────────────────────────────────────────────────
  deploy-content:
    name: "2 · km-content-worker"
    runs-on: ubuntu-latest
    needs: [typecheck, deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/content
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 3 (needs content + al + core) ───────────────────────────────────
  deploy-worldview:
    name: "3 · km-worldview-worker"
    runs-on: ubuntu-latest
    needs: [typecheck, deploy-content, deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/worldview
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-quran:
    name: "3 · km-quran-worker"
    runs-on: ubuntu-latest
    needs: [typecheck, deploy-al, deploy-content, deploy-worldview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/quran
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 4 (needs quran + core) ──────────────────────────────────────────
  deploy-planner:
    name: "4 · km-planner-worker"
    runs-on: ubuntu-latest
    needs: [typecheck, deploy-quran, deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/planner
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-arabic:
    name: "4 · km-arabic-worker"
    runs-on: ubuntu-latest
    needs: [typecheck, deploy-al, deploy-quran, deploy-planner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/arabic
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Phase 5 — GATEWAY (always last) ───────────────────────────────────────
  deploy-backend:
    name: "5 · km-backend-worker  ← PUBLIC API"
    runs-on: ubuntu-latest
    needs: [typecheck, deploy-quran, deploy-worldview, deploy-arabic, deploy-planner, deploy-content, deploy-al, deploy-studio, deploy-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g wrangler
      - run: wrangler deploy
        working-directory: workers/backend
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
