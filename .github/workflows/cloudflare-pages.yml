name: Deploy to Cloudflare Pages

# Cheap automatic deploys on free GitHub (owner, 2026-10-24): the web app is built and deployed only when a push
# changes it (apps/**, the package files, this workflow) — a worker or data push costs no minutes here. Pushes queue,
# never cancel. By hand: Actions → Deploy to Cloudflare Pages → Run workflow, or `npm run deploy:pages`.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --workspace apps/k-maps
          npm install --legacy-peer-deps --ignore-scripts

      - name: Build app
        run: npm run build -w apps/k-maps

      - name: Deploy app to Cloudflare Pages
        run: |
          # Cloudflare's Pages API rejects commit messages that contain
          # certain Unicode glyphs even though they're valid UTF-8 (box-
          # drawing chars `─`, certain dashes, etc.). Wrangler auto-attaches
          # the git commit message and the rejection fails the whole deploy.
          # Sanitize: strip everything outside basic ASCII + Latin-1.
          SAFE_MSG=$(git log -1 --pretty=%s | LC_ALL=C tr -d -c '\11\12\15\40-\176' | head -c 240)
          [ -z "$SAFE_MSG" ] && SAFE_MSG="Deploy $(git rev-parse --short HEAD)"
          echo "Sanitized commit message: $SAFE_MSG"
          for i in 1 2 3; do
            npx wrangler@4.66.0 pages deploy ${{ github.workspace }}/apps/k-maps/dist/k-maps/browser \
              --project-name k-maps \
              --branch main \
              --commit-message "$SAFE_MSG" \
              --commit-hash "$(git rev-parse HEAD)" && exit 0
            echo "Deploy attempt $i failed. Retrying in 15s..."
            sleep 15
          done
          echo "Deploy failed after 3 attempts."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
