name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    # Only rebuild when something that lands in the bundle changes. Note
    # `workers/shared/src/contracts/**`: apps/k-maps/tsconfig.json maps
    # `@kmaps/contracts/*` there, so a contract edit changes this app's
    # build even though it lives under workers/.
    paths:
      - "apps/k-maps/**"
      - "workers/shared/src/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-pages.yml"
      - ".github/workflows/_gate.yml"
  workflow_dispatch:

# One production deploy at a time. Superseding an in-flight build is safe
# here — Pages deploys are whole-bundle, so the newest commit wins.
concurrency:
  group: deploy-pages-k-maps
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.78.0"

defaults:
  run:
    shell: bash

jobs:
  # This app used to deploy to production with nothing verified first — the
  # worker pipeline had a gate, the two Angular apps did not.
  gate:
    uses: ./.github/workflows/_gate.yml

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --workspace apps/k-maps
          npm install --legacy-peer-deps --ignore-scripts

      - name: Build app
        run: npm run build -w apps/k-maps

      - name: Deploy app to Cloudflare Pages
        run: |
          # Cloudflare's Pages API rejects commit messages that contain
          # certain Unicode glyphs even though they're valid UTF-8 (box-
          # drawing chars `─`, certain dashes, etc.). Wrangler auto-attaches
          # the git commit message and the rejection fails the whole deploy.
          # Sanitize: strip everything outside basic ASCII + Latin-1.
          SAFE_MSG=$(git log -1 --pretty=%s | LC_ALL=C tr -d -c '\11\12\15\40-\176' | head -c 240)
          [ -z "$SAFE_MSG" ] && SAFE_MSG="Deploy $(git rev-parse --short HEAD)"
          echo "Sanitized commit message: $SAFE_MSG"
          for i in 1 2 3; do
            npx "wrangler@${WRANGLER_VERSION}" pages deploy ${{ github.workspace }}/apps/k-maps/dist/k-maps/browser \
              --project-name k-maps \
              --branch main \
              --commit-message "$SAFE_MSG" \
              --commit-hash "$(git rev-parse HEAD)" && exit 0
            echo "Deploy attempt $i failed. Retrying in 15s..."
            sleep 15
          done
          echo "Deploy failed after 3 attempts."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
