name: Dump a passage's class drills

# Run by hand: every drill each step of a passage's class deals, for review. The Qurʾān worker is
# run against the live D1 (wrangler dev --remote) and each step node is asked for its whole pool,
# several rounds, since some skills draw at random; the drills are merged by id and uploaded as
# an artifact. Nothing is written anywhere.

on:
  workflow_dispatch:
    inputs:
      passage:
        description: "Passage id (QR:SP:<surah>:<from>-<to>)"
        required: true
        default: "QR:SP:40:1-3"
      rounds:
        description: "Rounds per step (random skills deal differently each time)"
        required: true
        default: "4"

defaults:
  run:
    shell: bash

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PASSAGE: ${{ inputs.passage }}
      ROUNDS: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g wrangler
      - name: run the Qurʾān worker against the live database
        run: |
          (wrangler dev --remote --config workers/quran/wrangler.toml --port 8787 > dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8787/ && break; sleep 3; done
          tail -5 dev.log
      - name: dump every step's drills
        run: |
          mkdir -p out
          node --input-type=module - <<'EOF'
          import { writeFileSync } from 'node:fs';
          const base = 'http://localhost:8787';
          const passage = process.env.PASSAGE;
          const rounds = Number(process.env.ROUNDS || 4);
          const get = async (path) => {
            const r = await fetch(base + path);
            const t = await r.text();
            try { return JSON.parse(t); } catch { return { error: t.slice(0, 400), status: r.status }; }
          };
          const cls = await get(`/qr/practice/class/path?passage=${encodeURIComponent(passage)}`);
          const nodes = (cls?.data?.nodes ?? []).filter((n) => n.kind === 'step');
          const out = { passage, nodes: [] };
          for (const n of nodes) {
            const byId = new Map();
            const errors = [];
            for (let k = 0; k < rounds; k++) {
              const b = await get(`/qr/practice/class/node?passage=${encodeURIComponent(passage)}&node=${encodeURIComponent(n.key)}`);
              if (!b?.data) { errors.push(b); continue; }
              for (const d of b.data.items ?? []) if (!byId.has(d.id)) { const { srs, ...rest } = d; byId.set(d.id, rest); }
            }
            out.nodes.push({ key: n.key, title: n.title, count: byId.size, errors, drills: [...byId.values()] });
            console.log(n.key, byId.size, errors.length ? `errors: ${JSON.stringify(errors[0]).slice(0, 200)}` : '');
          }
          if (!out.nodes.length) console.log('class:', JSON.stringify(cls).slice(0, 800));
          writeFileSync('out/drills.json', JSON.stringify(out, null, 1));
          EOF
      - if: always()
        run: tail -40 dev.log
      - uses: actions/upload-artifact@v4
        with:
          name: class-drills
          path: out/
          retention-days: 7
