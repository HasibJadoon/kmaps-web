name = "km-content-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false   # internal only — accessed via km-backend-worker service binding

[[d1_databases]]
binding = "DB_CM"
database_name = "km_content"
database_id = "c59b9640-6e68-4068-8034-33a2fd66cd00"
migrations_dir = "migrations"
# CM does NOT manage its own ACL — uses CORE resource_grants via CORE Fetcher

[[services]]
binding = "CORE"
service = "km-core-worker"
