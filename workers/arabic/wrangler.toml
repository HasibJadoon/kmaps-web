name = "km-arabic-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false   # internal only — accessed via km-backend-worker service binding

[[d1_databases]]
binding = "DB_AR"
database_name = "km_arabic"
database_id = "7ffa77c9-2d6c-46cb-a360-b198da502252"
migrations_dir = "migrations"
# Pedagogy tables only (ar_*). Linguistic truth lives in DB_AL via AL:ULID refs.

[[services]]
binding = "AR_LINGUISTICS"
service = "km-ar-linguistics-worker"

[[services]]
binding = "QURAN"
service = "km-quran-worker"

[[r2_buckets]]
binding     = "AR_AUDIO"
bucket_name = "km-arabic-audio"

[[r2_buckets]]
binding     = "AR_VENDOR"
bucket_name = "km-arabic-vendor"
# Third-party publisher audio. Deliberately absent from the gateway's
# publicGetPaths: reached only through GET /ar/vendor-audio/:key+, which
# requires a token and returns a signed, expiring stream URL.
# Acquisition audio. Served read-only via GET /ar/audio/:key+ which the gateway
# allowlists for anonymous GET — an <audio> tag cannot send a Bearer token.
