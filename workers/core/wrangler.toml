name = "km-core-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false   # internal only — accessed via km-backend-worker service binding

[[d1_databases]]
binding = "DB_CORE"
database_name = "km_core"
database_id = "afe84ce7-04dd-45a1-99ac-f42ca53276d2"
migrations_dir = "migrations"

[vars]
JWT_EXPIRY_SECONDS = "3600"

# OAuth — client IDs are not secret, so they live here rather than in secrets.
# Each is a comma-separated audience list, because one provider can front
# several clients (a web services-id plus a native bundle-id, say). A provider
# with no id stays off, and /core/auth/providers reports that, so a login
# screen only ever draws a button that will actually work.

# Apple: the native iOS app's audience is its bundle id — Sign in with Apple
# puts the bundle id in `aud`, so this is the whole configuration for the
# kmaps-ios app. APPLE_REDIRECT_URI is intentionally absent: it is only needed
# for the *web* popup, which needs its own Apple services-id registered with
# that redirect. Leaving it unset keeps apple.enabled=false in /providers, so
# the web login hides a button it cannot complete, while the native
# POST /core/auth/oauth/apple route (which checks APPLE_CLIENT_ID alone) works.
# Add the services-id to this list and set the redirect when web is set up.
APPLE_CLIENT_ID = "com.kmaps.app"

# Who may publish a submitted card into the shared SRS library. Approving puts
# a card under a surah for everyone, so this is an explicit list rather than a
# role anyone can acquire. Comma-separated emails.
CARD_APPROVERS = "hasibjadoon@gmail.com"

# Google: the OAuth **iOS** client for bundle com.kmaps.app. No client secret —
# the app is a public client using authorization-code + PKCE and exchanges the
# code with Google directly, so only the resulting id_token reaches us and this
# id is the audience we verify it against. Append a web client id to the list
# when the web app needs Google too.
GOOGLE_CLIENT_ID = "246205307788-tl2pl1rah47t980o219p007p4650kg5s.apps.googleusercontent.com"

# Secrets (set via wrangler secret put):
#   JWT_SECRET      — shared with km-backend-worker
#   INTERNAL_SECRET — shared with km-backend-worker
