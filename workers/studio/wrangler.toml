name = "km-studio-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]   # @anthropic-ai/sdk imports node: built-ins
workers_dev = false   # internal only — accessed via km-backend-worker service binding

[[d1_databases]]
binding = "DB_ST"
database_name = "km_studio"
database_id = "93af175f-fc3e-40f2-b6c3-2877cc28c97f"
migrations_dir = "migrations"
# ST stores typed refs to other domains — never duplicates canonical content

# ─── Service binding — CORE owns identity; ST resolves cast emails to accounts ─
# the stage's renderer files, by content hash (st_overlay_release names them)
[[r2_buckets]]
binding     = "OVERLAY"
bucket_name = "km-studio-overlay"

[[services]]
binding = "CORE"
service = "km-core-worker"

# ─── Service binding — QR owns the passage; the brainstorm tutor reads it ─────
[[services]]
binding = "QR"
service = "km-quran-worker"

# ANTHROPIC_API_KEY is a secret: wrangler secret put ANTHROPIC_API_KEY --config workers/studio/wrangler.toml

# ─── Durable Object — live episode sessions ───────────────────────────────────
[[durable_objects.bindings]]
name = "EPISODE_SESSION"
class_name = "EpisodeSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EpisodeSession"]
