name = "km-quran-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false   # internal only — accessed via km-backend-worker service binding

# Run beside the database, not beside the reader: the D1 primary is in ENAM, and a practice
# round makes 10–60 queries, each a full round trip from wherever the isolate runs (≈250 ms
# from Sydney). Smart Placement moves the isolate next to D1; the gateway's single service-binding
# hop is the only long-haul trip left.
[[d1_databases]]
remote = true
binding       = "DB_QR"
database_name = "km_quran"
database_id   = "8dbd5053-c9b8-4dd0-9e45-1d66d3a58fba"
migrations_dir = "migrations"

[[r2_buckets]]
remote = true
binding     = "DEP_GRAPHS_BUCKET"
bucket_name = "km-quran-dep-graphs"

[[services]]
binding = "AR_LINGUISTICS"
service = "km-ar-linguistics-worker"

[[services]]
binding = "WORLDVIEW"
service = "km-worldview-worker"

[[services]]
binding = "CONTENT"
service = "km-content-worker"

[[services]]
binding = "ARABIC"
service = "km-arabic-worker"

[vars]
JWT_SECRET = "b940e563ab28d8df53a4b2b99a0c14980ffac7810bd93f80cc17d8bfaa3bf609"
# JWT_SECRET is set as a secret via `wrangler secret put JWT_SECRET`
