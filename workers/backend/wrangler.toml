name = "km-backend-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# ─── Single public domain ──────────────────────────────────────────────────────
[[routes]]
pattern = "backend.k-maps.com"
custom_domain = true

# ─── Internal service bindings (all 7 domain workers) ─────────────────────────
[[services]]
binding = "QURAN"
service = "km-quran-worker"

[[services]]
binding = "WORLDVIEW"
service = "km-worldview-worker"

[[services]]
binding = "ARABIC"
service = "km-arabic-worker"

[[services]]
binding = "AR_LINGUISTICS"
service = "km-ar-linguistics-worker"

[[services]]
binding = "CONTENT"
service = "km-content-worker"

[[services]]
binding = "STUDIO"
service = "km-studio-worker"

[[services]]
binding = "CORE"
service = "km-core-worker"

[vars]
# Comma-separated list of allowed CORS origins. Local dev reaches the API through the Angular
# proxy (same origin), so no localhost origin belongs here.
ALLOWED_ORIGINS = "https://k-maps.com,https://app.k-maps.com"

# Secrets — set via:
#   wrangler secret put JWT_SECRET --name km-backend-worker
# Domain workers are reached only through this gateway's service bindings: each has
# workers_dev = false and no routes (asserted by backend/test/exposure.test.ts).
