name = "km-planner-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false   # internal only — accessed via km-backend-worker service binding

[[d1_databases]]
binding = "DB_PL"
database_name = "km_planner"
database_id = "6a4bd15a-5471-4f87-8b33-902262b9a2f8"
migrations_dir = "migrations"
# PL stores typed refs to QR/AR resources — never duplicates canonical content

[[services]]
binding = "QURAN"
service = "km-quran-worker"

[[services]]
binding = "ARABIC"
service = "km-arabic-worker"

[[services]]
binding = "CORE"
service = "km-core-worker"
